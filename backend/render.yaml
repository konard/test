services:
  - type: web
    name: ferma-backend
    env: node
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ferma-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_SECRET
        sync: false
      - key: NOWPAYMENTS_API_KEY
        sync: false
      - key: NOWPAYMENTS_IPN_SECRET
        sync: false
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: FRONTEND_URL
        value: https://your-frontend.vercel.app

databases:
  - name: ferma-db
    databaseName: ferma_realnosti
    user: ferma_user
